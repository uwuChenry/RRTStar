<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>RRT Animation</title>
<style>
  body { font-family: sans-serif; background: #fafafa; color: #111; display: flex; flex-direction: column; align-items: center; margin: 16px; }
  h2 { margin: 4px 0 10px; font-weight: 600; }
  svg { background: white; border: 1px solid #333; max-width: 100%; height: auto; }
  .controls { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
  input[type=range]#scrub { width: min(500px, 80vw); }
  button { padding: 4px 14px; font-size: 15px; }
</style></head><body>
<h2 id="title"></h2>
<svg id="canvas" width="600" height="600" viewBox="0 0 600 600">
<circle cx="300" cy="300" r="195" fill="black"/>
<rect x="50" y="100" width="150" height="50" fill="black"/>
<g id="tree" stroke="red" stroke-width="1"></g>
<polyline id="path" fill="none" stroke="limegreen" stroke-width="4" points="" />
<circle id="sample" r="4" fill="none" stroke="gray" visibility="hidden" />
<circle cx="100" cy="300" r="8" fill="blue"/>
<circle cx="500" cy="300" r="8" fill="gold" stroke="black"/>
</svg>
<div class="controls">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" value="0">
  <label>Speed <input id="speed" type="range" min="5" max="600" value="60"></label>
  <span id="speedLabel">60 it/s</span>
</div>
<script>
const NODES = [[100,300,-1,0],[75.5687,305.302,0,5],[95.9969,275.323,0,13],[101.546,250.946,2,14],[113.354,228.911,3,23],[127.089,208.022,4,35],[131.998,183.508,5,36],[80.0685,329.894,1,37],[97.5246,347.79,7,39],[146.707,163.293,6,45],[92.1442,372.204,8,46],[114.624,383.143,10,47],[69.441,382.672,10,48],[169.053,152.084,9,67],[131.203,401.855,11,73],[139.278,425.515,14,74],[55.7219,335.572,7,81],[55.9463,312.404,1,88],[125.948,446.665,15,89],[107.186,180.443,6,91],[86.5984,166.261,19,96],[147.736,458.925,18,97],[165.407,476.609,21,105],[188.634,467.363,22,106],[107.028,463.005,18,110],[107.679,429.599,18,125],[71.0021,275.833,2,130],[210.77,478.981,23,133],[234.886,485.572,27,136],[67.9679,182.931,20,142],[231.271,510.309,28,144],[254.662,519.133,30,146],[158.471,500.628,22,147],[279.327,515.058,31,148],[297.231,497.61,33,149],[75.8274,257.748,26,154],[96.4636,485.663,24,156],[149.428,154.579,9,171],[215.831,529.972,30,174],[320.995,505.374,34,176],[31.1247,331.103,16,177],[266.679,505.079,33,180],[72.6457,281.115,26,185],[342.569,492.742,39,187],[367.317,496.281,43,196],[392.262,497.937,44,198],[403.405,475.557,45,199],[54.5228,204.008,29,200],[425.972,464.8,46,201],[49.1721,309.251,17,203],[42.9845,226.186,47,205],[450.899,466.714,48,206],[474.175,457.591,51,207],[478.218,432.92,52,208],[474.028,408.274,53,210],[479.859,383.964,54,211],[321.376,530.371,39,213],[150.444,524.304,32,216],[319,509.643,39,219],[139.497,546.78,57,220],[503.201,431.996,53,222],[485.691,359.653,55,223],[453.222,433.395,53,224],[98.7384,503.715,36,228],[307.709,551.305,56,229],[116.212,428.261,25,231],[178.653,515.383,32,232],[96.3649,501.62,63,236],[110.87,443.54,25,238],[486.529,479.326,52,239],[326.604,531.123,56,243],[221.505,554.319,38,244],[165.044,480.306,22,245],[349.597,540.937,70,249],[489.908,481.472,69,251],[141.153,547.849,59,253],[370.869,520.258,44,259],[467.892,400.024,54,265],[509.805,353.059,61,266],[22.4344,211.949,50,268],[238.57,572.589,71,269],[489.627,416.803,54,270],[505.262,328.476,78,271],[250.086,562.673,80,272],[500.719,303.892,82,273],[500,300,84,273]];
const PATH = [[100,300],[75.5687,305.302],[80.0685,329.894],[97.5246,347.79],[92.1442,372.204],[114.624,383.143],[131.203,401.855],[139.278,425.515],[125.948,446.665],[147.736,458.925],[165.407,476.609],[188.634,467.363],[210.77,478.981],[234.886,485.572],[231.271,510.309],[254.662,519.133],[279.327,515.058],[297.231,497.61],[320.995,505.374],[342.569,492.742],[367.317,496.281],[392.262,497.937],[403.405,475.557],[425.972,464.8],[450.899,466.714],[474.175,457.591],[478.218,432.92],[474.028,408.274],[479.859,383.964],[485.691,359.653],[509.805,353.059],[505.262,328.476],[500.719,303.892],[500,300]];
const TOTAL_ITER = 273;
const TITLE = "RRT";

const SVGNS = "http://www.w3.org/2000/svg";
const treeG = document.getElementById("tree");
const pathEl = document.getElementById("path");
const sampleEl = document.getElementById("sample");
const titleEl = document.getElementById("title");
const scrub = document.getElementById("scrub");
const playBtn = document.getElementById("play");
const speedEl = document.getElementById("speed");
scrub.max = TOTAL_ITER;

let shown = 1;        // number of nodes currently drawn (node 0 = start)
let iter = 0;
let playing = true;
let last = 0;

function addEdge(i) {
  const [x, y, p] = NODES[i];
  if (p < 0) return;
  const l = document.createElementNS(SVGNS, "line");
  l.setAttribute("x1", x); l.setAttribute("y1", y);
  l.setAttribute("x2", NODES[p][0]); l.setAttribute("y2", NODES[p][1]);
  treeG.appendChild(l);
}

function setIteration(target) {
  target = Math.max(0, Math.min(TOTAL_ITER, target));
  if (target < iter) { treeG.replaceChildren(); shown = 1; }
  iter = target;
  let newest = -1;
  while (shown < NODES.length && NODES[shown][3] <= iter) { addEdge(shown); newest = shown; shown++; }
  if (newest >= 0) {
    sampleEl.setAttribute("cx", NODES[newest][0]); sampleEl.setAttribute("cy", NODES[newest][1]);
    sampleEl.setAttribute("visibility", "visible");
  }
  const done = iter >= TOTAL_ITER;
  pathEl.setAttribute("points", done ? PATH.map(p => p.join(",")).join(" ") : "");
  if (done) sampleEl.setAttribute("visibility", "hidden");
  titleEl.textContent = done
    ? `${TITLE} - Complete (${TOTAL_ITER} iterations, ${NODES.length} nodes${PATH.length ? "" : ", no path found"})`
    : `${TITLE} - Iteration ${iter}`;
  scrub.value = iter;
}

function frame(t) {
  const perSecond = Number(speedEl.value);
  if (playing && t - last >= 1000 / Math.min(perSecond, 60)) {
    const step = Math.max(1, Math.round(perSecond / 60));
    last = t;
    setIteration(iter + step);
    if (iter >= TOTAL_ITER) { playing = false; playBtn.textContent = "Replay"; }
  }
  requestAnimationFrame(frame);
}

playBtn.onclick = () => {
  if (iter >= TOTAL_ITER) { setIteration(0); playing = true; }
  else playing = !playing;
  playBtn.textContent = playing ? "Pause" : "Play";
};
scrub.oninput = () => { playing = false; playBtn.textContent = "Play"; setIteration(Number(scrub.value)); };
speedEl.oninput = () => { document.getElementById("speedLabel").textContent = speedEl.value + " it/s"; };

setIteration(0);
requestAnimationFrame(frame);
</script>
</body></html>
